<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <style>
            /* Toto rozmaže pozadie iba pod kartou, navbar zostane nedotknutý */
            .glass-card {
                /* rgba(255, 255, 255, 0.4) je polopriehľadná biela */
                background-color: rgba(255, 255, 255, 0.4) !important; 
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }

            /* Fixácia pozadia, aby sa pri skrolovaní nehýbalo */
            body {
                background-attachment: fixed;
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
            }
            
            /* Zabezpečíme, aby navbar mal svoju pevnú farbu a nebol ovplyvnený */
            .navbar {
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }

            .flash { padding: 10px; margin: 10px 0; border-radius: 5px; }
            .success { background-color: #d4edda; color: #155724; width: 350px; border-radius: 10px; text-align: center; margin: 20px auto; }
            .error { background-color: #f8d7da; color: #721c24; width: 350px; border-radius: 10px; text-align: center; margin: 20px auto; }
        </style>
    
    </head>
    
    <body style="background-image: url('{{ url_for('static', filename='img/generated_image.jpg') }}'); ">
        <nav class="navbar bg-body-tertiary" style="background-color: #eacaac !important;">
            <div class="container-fluid">
                <a href="{{ url_for('base') }}">
                    <img src="{{ url_for('static', filename='img/stiahnuť.png') }}" alt="Ikona knihy" style="width: 50px;">
                </a>
                <form class="d-flex" role="search">
                    <input class="form-control me-2 border border-dark focus-ring focus-ring-dark" style="background-color: #e2bd9bea !important;" type="search" placeholder="Search" aria-label="Search"/>
                    <button class="btn btn-outline-dark" type="submit">Search</button>
                </form>
            </div>
        </nav>
        <h1 class="text-center fs-1 fw-bolder" style="margin-top: 30px;">Logout Page</h1>
        
        <div class="blur-area">
            <div class="card mx-auto mb-3 glass-card rounded-10 " style="width: 40rem;height: 15rem; margin-top: 150px; border: none;">
                <div class="row g-0">

        
            <div class="col-md- p-3 d-flex flex-column justify-content-center align-items-center">
                <form action="/logout" method="post">

                    
                    <h2 class="font-monospace" style="margin-top: 40px;">Are you shure you want to logout?</h2>
                    
                    <button class="btn btn-danger font-monospace" style=" width: 350px;border-radius: 20px; margin-top: 50px; text-align: center;margin-left: 110px;">Sign out</button>
                        
                        
                </form>
                
            </div>
            </div>

        </div>
        </div>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul>
                {% for category, message in messages %}
                    <p class="{{ category }} font-monospace">{{ message }}</p>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}
    <footer class="py-4 mt-6 text-center fixed-bottom" style="background-color: #eacaac;">
            <a class="navbar-brand font-monospace"> Want to know more about us?</a><a class="btn font-monospace" href="{{ url_for('contact') }}">Click here!</a>
    </footer>
    </body>
    
</html>
