<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Logout</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        
        <style>
            html, body { height: 100%; margin: 0; padding: 0; overflow-x: hidden; }
            body {
                display: flex;
                flex-direction: column;
                background: url('{{ url_for('static', filename='img/generated_image.jpg') }}') no-repeat center center fixed;
                background-size: cover;
            }
            
            .main-content {
                flex: 1 1 auto;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding-top: 5rem;
                padding-bottom: 90px;
            }
            .glass-card {
                background-color: rgba(255, 255, 255, 0.4) !important; 
                backdrop-filter: blur(10px);
                border-radius: 20px;
            }
            
            .always-visible-footer {
                position: fixed !important;
                bottom: 0 !important;
                left: 0 !important;
                right: 0 !important;
                width: 100% !important;
                height: 90px;
                background-color: #eacaac !important;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 15px;
            }
            .navbar-brand-text {
                font-family: 'Brush Script MT', cursive; 
                color: #c78547; 
                margin: 0; 
                white-space: nowrap; 
                flex-grow: 1; 
                text-align: center;
                font-size: 1.5rem;
            }
            .flash { padding: 10px; margin: 10px 0; border-radius: 5px; }
            .success { background-color: #d4edda; color: #155724; width: 350px; border-radius: 10px; text-align: center; margin: 20px auto; }
            .error { background-color: #f8d7da; color: #721c24; width: 350px; border-radius: 10px; text-align: center; margin: 20px auto; }
        </style>
    </head>
    
    <body>
        <nav class="navbar bg-body-tertiary fixed-top" style="background-color: #eacaac !important; height: 4rem;">
                <div class="container-fluid d-flex align-items-center justify-content-between flex-nowrap">
                    <a >
                        <img src="{{ url_for('static', filename='img/stiahnuť.png') }}" alt="Ikona knihy" style="width: 50px;">
                    </a>
                    
                    <a class="btn btn-dark" href="{{ url_for('base') }}" role="button" style="font-family: 'Pinyon Script', cursive;">Back</a>
                </div>
        </nav>

        <div class="main-content">
            <h1 class="text-center fw-bolder mb-4" style="font-family: 'Pinyon Script', cursive;">Logout</h1>
            
            <div class="card glass-card p-4 text-center" style="width: 90%; max-width: 35rem; border: none;font-family: 'Pinyon Script', cursive;">
                <form action="/logout" method="post">
                    <h2 class="font-monospace mt-3">Are you sure you want to logout?</h2>
                    <button class="btn btn-danger font-monospace mt-4 w-100" style="border-radius: 20px; max-width: 350px;font-family: 'Pinyon Script', cursive;">Sign out</button>
                </form>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="mt-3">
                        {% for category, message in messages %}
                            <p class="{{ category }} font-monospace">{{ message }}</p>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
        </div>

        </div> 
        <footer class="py-4 text-center" style="background-color: #eacaac; width: 100%;">
            <a class="navbar-brand font-monospace"> Want to know more about us?</a>
            <a class="btn font-monospace" href="{{ url_for('contact') }}">Click here!</a>
        </footer>
    </body>
</html>
