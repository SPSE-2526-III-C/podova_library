<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        
        <style>
            
            html, body {
                height: 100%;
                margin: 0;
            }
            body {
                display: flex;
                flex-direction: column;
                background-attachment: fixed;
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
            }
            .content-wrapper {
                flex: 1 0 auto; 
            }
            footer {
                flex-shrink: 0; 
            }

            
            .glass-card {
                background-color: rgba(255, 255, 255, 0.4) !important; 
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }
            
            .navbar {
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }

            .flash { padding: 10px; margin: 10px 0; border-radius: 5px; }
            .success { background-color: #d4edda; color: #155724; width: 350px; border-radius: 10px; text-align: center; margin: 20px auto; }
            .error { background-color: #f8d7da; color: #721c24; width: 350px; border-radius: 10px; text-align: center; margin: 20px auto; }

            /* responzívne úpravy*/
            @media (max-width: 576px) {
                .navbar h1 {
                    font-size: 1.5rem !important;
                }
                
                .glass-card {
                    width: 90% !important;
                    height: auto !important;
                    padding-bottom: 20px !important;
                    margin-top: 30px !important;
                }

                form, .mb-3, .input-group, form button {
                    width: 100% !important;
                    max-width: 100% !important;
                }

                .success, .error {
                    width: 90% !important;
                }
            }
        </style>
    
    </head>
    
    <body style="background-image: url('{{ url_for('static', filename='img/generated_image.jpg') }}');">
        
        <div class="content-wrapper">
            
            <nav class="navbar bg-body-tertiary fixed-top" style="background-color: #eacaac !important; height: 4rem;">
                <div class="container-fluid d-flex align-items-center justify-content-between flex-nowrap">
                    <a >
                        <img src="{{ url_for('static', filename='img/stiahnuť.png') }}" alt="Ikona knihy" style="width: 50px;">
                    </a>
                    
                    <a class="btn btn-dark" href="{{ url_for('base') }}" role="button">Back</a>
                </div>
            </nav>

            <h1 style="text-align: center; margin-top: 7rem; font-family: 'Pinyon Script', cursive;">Login</h1>
            
            <div class="blur-area">
                <div class="card mx-auto mb-3 glass-card rounded-10" style="width: 29rem; height: 25rem; margin-top: 80px; border: none;">
                    <div class="row g-0">
                        <div class="col-12 p-3 d-flex flex-column justify-content-center align-items-center">
                            <form action="/login" method="post">

                                <div class="input-group mb-4 " style="margin-top: 30px;font-family: 'Pinyon Script', cursive;">
                                    <label class="w-100">Email</label>
                                    <input type="text" name="email" class="form-control-plaintext border-bottom border-dark" placeholder="bibi@gmail.com" autocomplete="off">
                                </div>

                                <div class="mb-3 " style="margin-top: 10px; width: 350px;font-family: 'Pinyon Script', cursive;">
                                    <label class="w-100">Password</label>
                                    <input type="password" name="password" class="form-control-plaintext border-bottom border-dark" placeholder="hi123" autocomplete="off">
                                </div>

                                <button class="btn btn-dark " style="width: 350px; border-radius: 20px; margin-top: 50px;font-family: 'Pinyon Script', cursive;">Login</button>
                                  
                            </form>
                            
                            <div class="navbar-text" style="margin-top: 20px;font-family: 'Pinyon Script', cursive;">
                                <span class="">Not a member?</span>
                                <a class="btn font-monospace text-warning-emphasis p-0 ms-1" href="{{ url_for('register') }}" style="vertical-align: baseline;">Sign up!</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <ul class="list-unstyled p-0">
                        {% for category, message in messages %}
                            <p class="{{ category }} font-monospace mx-auto">{{ message }}</p>
                        {% endfor %}
                    </ul>
                {% endif %}
            {% endwith %}
            
        </div> 
        <footer class="py-4 text-center" style="background-color: #eacaac; width: 100%;">
            <a class="navbar-brand font-monospace"> Want to know more about us?</a>
            <a class="btn font-monospace" href="{{ url_for('contact') }}">Click here!</a>
        </footer>

    </body>
</html>
