<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <style>
            /* Toto rozmaže pozadie iba pod kartou, navbar zostane nedotknutý */
            .glass-card {
                /* rgba(255, 255, 255, 0.4) je polopriehľadná biela */
                background-color: rgba(255, 255, 255, 0.4) !important; 
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }

            /* Fixácia pozadia, aby sa pri skrolovaní nehýbalo */
            body {
                background-attachment: fixed;
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
            }
            
            /* Zabezpečíme, aby navbar mal svoju pevnú farbu a nebol ovplyvnený */
            .navbar {
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }

            .flash { padding: 10px; margin: 10px 0; border-radius: 5px; }
            .success { background-color: #d4edda; color: #155724; width: 350px; border-radius: 10px; text-align: center; margin: 20px auto; }
            .error { background-color: #f8d7da; color: #721c24; width: 350px; border-radius: 10px; text-align: center; margin: 20px auto; }
        </style>
    
    </head>
    
    <body style="background-image: url('{{ url_for('static', filename='img/generated_image.jpg') }}'); ">
        <nav class="navbar bg-body-tertiary fixed-top" style="background-color: #eacaac !important; height: 4rem;">
            <div class="container-fluid">
                <a href="{{ url_for('base') }}">
                    <img src="{{ url_for('static', filename='img/stiahnuť.png') }}" alt="Ikona knihy" style="width: 50px;">
                </a>
                <h1 style="font-family: 'Brush Script MT', cursive; color: #c78547;">Books of your dreams</h1> 
                <a class="btn btn-dark" href="{{ url_for('base') }}" role="button">Back</a>
                
            </div>
        </nav>
        <h1 class="text-align: center;" style="text-align: center; margin-top: 7rem; font-family: 'Pinyon Script', cursive; ">Login </h1>
        
        <div class="blur-area">
            <div class="card mx-auto mb-3 glass-card rounded-10 " style="width: 29rem;height: 25rem; margin-top: 80px; border: none;">
                <div class="row g-0">

        
            <div class="col-md- p-3 d-flex flex-column justify-content-center align-items-center">
                <form action="/login" method="post">

                    <div class="input-group mb-4 font-monospace" style=" margin-top: 30px;">
                        
                        <label>Email</label>
                        <input type="text" name="email" class="form-control-plaintext border-bottom border-dark" placeholder="bibi@gmail.com">
                    </div>


                    <div class="mb-3 font-monospace" style=" margin-top: 10px; width: 350px;">
                        
                        <label>Password</label>
                        <input type="password" name="password" class="form-control-plaintext border-bottom border-dark" placeholder="hi123">
                    </div>


                    <button class="btn btn-dark font-monospace" style=" width: 350px;border-radius: 20px; margin-top: 50px;">Login</button>
                      

                </form>
              <div class="navbar-text" style="margin-top: 20px;">
                <span class="font-monospace">Not a member?</span>
                <a class="btn font-monospace text-warning-emphasis p-0 ms-1 font-monospace" href="{{ url_for('register') }}" style="vertical-align: baseline; ">Sign up!</a>
              </div>
            </div>
            </div>

        </div>
        </div>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul>
                {% for category, message in messages %}
                    <p class="{{ category }} font-monospace">{{ message }}</p>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}
    <footer class="py-4 mt-6 text-center fixed-bottom" style="background-color: #eacaac;">
            <a class="navbar-brand font-monospace"> Want to know more about us?</a><a class="btn font-monospace" href="{{ url_for('contact') }}">Click here!</a>
    </footer>
    </body>
    
</html>
