<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>

    <body style="background-color: #fbf0de;">
        <nav class="navbar bg-body-tertiary" style="background-color: #eacaac !important;">
            <div class="container-fluid">
                <a href="{{ url_for('base') }}">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-book-half text-dark" viewBox="0 0 16 16"> 
                        <path d="M8.5 2.687c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783"/> 
                    </svg>
                </a>
                <form class="d-flex" role="search">
                    <input class="form-control me-2 border border-dark focus-ring focus-ring-dark" style="background-color: #e2bd9bea !important;" type="search" placeholder="Search" aria-label="Search"/>
                    <button class="btn btn-outline-dark" type="submit">Search</button>
                </form>
            </div>
        </nav>
        <p class="text-center fs-1 fw-bolder">Books of your dreams</p> 
        <p class="text-center fs-6 fw-bolder  fw-bolder font-monospace">Every page is a new adventure</p>
        <hr class="fade-line my-4">
        <div class="container mt-1 ">
            <ul class="nav justify-content-center d-flex justify-content-between">
                <li class="nav-item font-monospace">
                    <a class="nav-link active text-black text-opacity-100" aria-current="page" href="books.html">Your books!</a>
                </li>
                <li class="nav-item font-monospace">
                    <a class="nav-link text-black text-opacity-75" href="">Login</a>
                </li>
                <li class="nav-item font-monospace">
                    <a class="nav-link text-black text-opacity-50" href="{{ url_for('progress') }}">Progress</a>
                </li>
                <li class="nav-item font-monospace">
                    <a class="nav-link text-black text-opacity-25" href="">AI_assistant</a>
                </li>
            </ul>
        </div>
        <hr class="fade-line my-4">
        <p class="text-center fs-2 fw-bolder font-monospace">You last read</p>
        
        
        {% block content %}{% endblock %}
        <footer class="py-4 mt-6 text-center fixed-bottom" style="background-color: #eacaac;">
            <a class="navbar-brand font-monospace"> Want to know more about us?</a><a class="btn font-monospace" href="{{ url_for('contact') }}">Click here!</a>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
        
        
    </body>
    
</html>
