<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}books_ofyourdreams{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>

    <body style="background-color: #fbf0de;">
        <nav class="navbar bg-body-tertiary" style="background-color: #eacaac !important;">
            <div class="container-fluid">
                <a href="{{ url_for('base') }}">
                    <img src="{{ url_for('static', filename='img/stiahnuť.png') }}" alt="Ikona knihy" style="width: 50px;">
                </a>
                <form class="d-flex" role="search" method="post" action="/hladaj">
                    <input class="form-control me-2 border border-dark focus-ring focus-ring-dark" style="background-color: #e2bd9bea !important;" type="text" placeholder="Search" aria-label="Search" name="kniha"/>
                    <button class="btn btn-outline-dark" type="submit">Search</button>
                </form>
            </div>
        </nav>
        
        <p class="text-center  fs-1 fw-bolder" style="font-family: 'Pinyon Script', cursive;">Books of your dreams</p> 
        <p class="text-center fs-6 fw-bolder  fw-bolder font-monospace">Every page is a new adventure</p>
        <hr class="fade-line my-4">
        <div class="container mt-1 ">
            <ul class="nav justify-content-center d-flex justify-content-between">
                <li class="nav-item font-monospace">
                    <a class="nav-link text-black text-opacity-100" href="{{ url_for('profile') }}">Your books!</a>
                </li>
                <li class="nav-item font-monospace">
                    <a class="nav-link text-black text-opacity-75" href="{{ url_for('login') }}">Login</a>
                </li>
                <li class="nav-item font-monospace">
                    <a class="nav-link text-black text-opacity-50" href="{{ url_for('logout') }}">Logout</a>
                </li>
                <li class="nav-item font-monospace">
                    <a class="nav-link text-black text-opacity-25" href="">AI_assistant</a>
                </li>
            </ul>
        </div>
        <hr class="fade-line my-4">
        <p class="text-center fs-2 fw-bolder font-monospace">You last read</p>

        
        
        
        {% block content %}{% endblock %}
        <footer class="py-4 mt-6 text-center fixed-bottom" style="background-color: #eacaac;">
            <a class="navbar-brand font-monospace"> Want to know more about us?</a><a class="btn font-monospace" href="{{ url_for('contact') }}">Click here!</a>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
        
        
    </body>
    
</html>
