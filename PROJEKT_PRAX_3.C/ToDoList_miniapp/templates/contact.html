<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <style>
            /* Toto rozmaže pozadie iba pod kartou, navbar zostane nedotknutý */
            .glass-card {
                /* rgba(255, 255, 255, 0.4) je polopriehľadná biela */
                background-color: rgba(255, 255, 255, 0.4) !important; 
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }

            /* Fixácia pozadia, aby sa pri skrolovaní nehýbalo */
            body {
                background-attachment: fixed;
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
            }
            
            /* Zabezpečíme, aby navbar mal svoju pevnú farbu a nebol ovplyvnený */
            .navbar {
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }
        </style>
    
    </head>

    <body style="background-image: url('{{ url_for('static', filename='img/generated_image.jpg') }}'); ">
        <nav class="navbar bg-body-tertiary" style="background-color: #eacaac !important;">
            <div class="container-fluid">
                <a href="{{ url_for('base') }}">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-book-half text-dark" viewBox="0 0 16 16"> 
                        <path d="M8.5 2.687c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783"/> 
                    </svg>
                </a>
                <form class="d-flex" role="search">
                    <input class="form-control me-2 border border-dark focus-ring focus-ring-dark" style="background-color: #e2bd9bea !important;" type="search" placeholder="Search" aria-label="Search"/>
                    <button class="btn btn-outline-dark" type="submit">Search</button>
                </form>
            </div>
        </nav>
        <h1 class="text-center fs-1 fw-bolder" style="margin-top: 30px;">Contact Us Page</h1>
        
        <div class="blur-area">
            <div class="card mx-auto mb-3 glass-card rounded-10  " style="width: 45rem; margin-top: 80px; height: 21rem; border: none;">
                <div class="row g-0">

        
            <div class="col-md-6 p-3">
                <form action="{{ url_for('contact') }}" method="POST">

                    <div class="mb-3 font-monospace">
                        <label >Full Name</label>
                        <input type="text" name="name" class="form-control-plaintext border-bottom border-dark" placeholder="">
                    </div>

                    <div class="mb-3 font-monospace">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control-plaintext border-bottom border-dark" placeholder="">
                    </div>

                    <div class="mb-3 font-monospace">
                        <label>Message</label>
                        <textarea name="message" class="form-control-plaintext border-bottom border-dark"></textarea>
                    </div>

                    <button type="submit" class="btn btn-dark font-monospace" style="margin-left: 0px; width: 18rem;border-radius: 20px;">Contact Us</button>

                </form>
            </div>

            
            <div class="col-md-6 p-3" style="">
                <h5 class="card-title" style="padding-top: 10px;">Contact:</h5>
                <p class="card-text">
                    booksofyourdreams123@gmail.com
                </p>
                <h5 class="card-title" style="padding-top: 40px;">Phone:</h5>
                <p class="card-text">
                    +421 123 456 789
                </p>
                <div class="container" style="padding-top: 40px;">
                    <a href="https://www.instagram.com/books_ofyourdreams/" target="_blank" rel="noopener noreferrer" style="color: black;">

                        </svg>
                    </a>
                    <a href="https://x.com/booksdream123" target="_blank" rel="noopener noreferrer" style="color: black;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-facebook" viewBox="0 0 16 16" style="margin-left: 20px;">
                            <path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951"/>
                        </svg>
                    </a>
                    <a href="https://x.com/booksdream123" target="_blank" rel="noopener noreferrer" style="color: black;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-twitter-x" viewBox="0 0 16 16" style="margin-left: 20px;">
                            <path d="M12.6.75h2.454l-5.36 6.142L16 15.25h-4.937l-3.867-5.07-4.425 5.07H.316l5.733-6.57L0 .75h5.063l3.495 4.633L12.601.75Zm-.86 13.028h1.36L4.323 2.145H2.865z"/>
                        </svg>
                    </a>
                    
                </div>

            </div>

        </div>
        </div>
    </div>
    {% block content %}{% endblock %}
    <footer class="py-4 mt-6 text-center fixed-bottom" style="background-color: #eacaac;">
            <a class="navbar-brand font-monospace"> Want to know more about us?</a><a class="btn font-monospace" href="{{ url_for('contact') }}">Click here!</a>
    </footer>
    </body>
    
</html>
